<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wst plog · 生活影像记录</title>
  <meta name="description" content="wst 的照片与生活记录：走过的城市、吃过的饭，和某一刻恰好落在墙上的光。">
  <meta property="og:title" content="wst plog · 生活影像记录">
  <meta property="og:description" content="走过的城市、吃过的饭，和某一刻恰好落在墙上的光。">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f7f4ee">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1916'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23f7f4ee' text-anchor='middle'%3Ew%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="wst plog 首页">
      <span class="brand-mark">w</span>
      <span class="brand-text">wst plog</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html" class="is-active">记录</a>
      <a href="https://github.com/wst-wst" target="_blank" rel="noopener">GitHub<span class="ext">↗</span></a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">Photo log · est. 2026</p>
        <h1>把普通的日子<br>慢慢拍下来</h1>
        <p class="lede">这里没有宏大的叙事，只有走过的街、吃过的饭，和某一刻恰好落在墙上的光。偶尔写字，大多数时候只是按下快门。</p>
        <dl class="stats">
          <div><dt>篇记录</dt><dd id="statPosts">—</dd></div>
          <div><dt>座城市</dt><dd id="statCities">—</dd></div>
          <div><dt>张照片</dt><dd id="statPhotos">—</dd></div>
        </dl>
      </div>
      <figure class="hero-figure">
        <img src="assets/img/hero.jpg" alt="傍晚的海边小城街道，暖黄的窗光落在石板路上" loading="eager">
        <figcaption>2026 · 青岛，八大关</figcaption>
      </figure>
    </section>

    <section class="timeline" id="plog" aria-labelledby="latestTitle">
      <div class="section-head">
        <h2 id="latestTitle">记录</h2>
        <div class="filters" id="filters" role="group" aria-label="按标签筛选"></div>
      </div>
      <div id="timeline"></div>
      <p class="empty" id="empty" hidden>这个标签下还没有记录。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year">2026</span> wst plog · 生活影像记录</p>
    <p class="footer-note">Hosted on GitHub Pages · Made with plain HTML</p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" data-close></div>
    <button class="lb-close" data-close aria-label="关闭详情">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一条记录">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一条记录">›</button>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <div class="lb-media" id="lbMedia"></div>
      <div class="lb-body">
        <p class="lb-meta" id="lbMeta"></p>
        <h2 id="lbTitle"></h2>
        <div class="lb-text" id="lbText"></div>
        <div class="lb-tags" id="lbTags"></div>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
