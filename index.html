<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wst plog</title>
  <meta name="description" content="wst 的照片与生活记录：走过的城市、吃过的饭，和某一刻恰好落在墙上的光。">
  <meta property="og:title" content="wst plog">
  <meta property="og:description" content="走过的城市、吃过的饭，和某一刻恰好落在墙上的光。">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f7f4ee">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1916'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23f7f4ee' text-anchor='middle'%3Ew%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="wst plog 首页">
      <span class="brand-mark">w</span>
      <span class="brand-text">wst plog</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html" class="is-active">记录</a>
    </nav>
  </header>

  <main>
    <section class="showcase" id="showcase" aria-roledescription="carousel" aria-label="随机照片">
      <div class="showcase-stage" id="showcaseStage"></div>
      <button type="button" class="showcase-nav prev" id="scPrev" aria-label="上一张">‹</button>
      <button type="button" class="showcase-nav next" id="scNext" aria-label="下一张">›</button>
      <div class="showcase-dots" id="scDots" role="tablist" aria-label="切换照片"></div>
      <p class="showcase-count"><span id="scIndex">01</span><span class="slash">/</span><span id="scTotal">05</span></p>
    </section>

    <section class="timeline" id="plog" aria-labelledby="latestTitle">
      <div class="section-head">
        <h2 id="latestTitle">记录</h2>
        <div class="filters" id="filters" role="group" aria-label="按标签筛选"></div>
      </div>
      <div id="timeline"></div>
      <p class="empty" id="empty" hidden>这个标签下还没有记录。</p>
    </section>

    <nav class="year-rail" id="yearRail" aria-label="按年份跳转"></nav>
  </main>

  <footer class="site-footer">
    <p>© <span id="year">2026</span> wst plog</p>
    <p class="site-stats" id="siteStats" hidden>
      <span class="stat" title="浏览人数" aria-label="浏览人数">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <circle cx="8" cy="5" r="2.6"/>
          <path d="M2.9 13.3c.5-2.4 2.6-3.8 5.1-3.8s4.6 1.4 5.1 3.8"/>
        </svg>
        <span id="busuanzi_value_site_uv">—</span>
      </span>
      <span class="stat" title="浏览次数" aria-label="浏览次数">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.6 8S3.9 3.9 8 3.9 14.4 8 14.4 8 12.1 12.1 8 12.1 1.6 8 1.6 8Z"/>
          <circle cx="8" cy="8" r="1.8"/>
        </svg>
        <span id="busuanzi_value_site_pv">—</span>
      </span>
    </p>
    <p class="footer-note">Hosted on GitHub Pages · Made with plain HTML</p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" data-close></div>
    <button class="lb-close" data-close aria-label="关闭详情">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一条记录">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一条记录">›</button>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <div class="lb-media" id="lbMedia"></div>
      <div class="lb-body">
        <p class="lb-meta" id="lbMeta"></p>
        <h2 id="lbTitle"></h2>
        <div class="lb-text" id="lbText"></div>
        <div class="lb-tags" id="lbTags"></div>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/showcase.js"></script>
  <script src="assets/js/app.js"></script>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
